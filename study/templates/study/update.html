<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>学習記録を編集 | StudyStack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            color: #625d68;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 215, 225, 0.65),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(220, 210, 255, 0.6),
                    transparent 35%
                ),
                #fffafb;
        }

        .update-container {
            width: 100%;
            max-width: 500px;
            padding: 24px;

            animation: fadeUp 0.7s ease-out;
        }

        .update-card {
            padding: 38px 34px;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid rgba(235, 215, 225, 0.85);
            border-radius: 26px;

            box-shadow:
                0 12px 35px rgba(130, 105, 125, 0.12);

            backdrop-filter: blur(8px);
        }

        .title-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .rabbit {
            display: inline-block;
            margin-bottom: 5px;

            font-size: 34px;

            animation: rabbitFloat 2.8s ease-in-out infinite;
        }

        h1 {
            margin: 4px 0 8px;

            color: #786b7d;
            font-size: 25px;
            letter-spacing: 0.06em;
        }

        .subtitle {
            margin: 0;

            color: #aaa0ad;
            font-size: 13px;
        }

        form label {
            display: block;

            margin-bottom: 8px;

            color: #807583;
            font-size: 13px;
            font-weight: 600;
        }

        form input {
            width: 100%;

            padding: 12px 14px;

            color: #625d68;
            font-size: 15px;

            background: #fff;

            border: 1px solid #e5dce4;
            border-radius: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        form input:focus {
            border-color: #d7b7c9;

            box-shadow:
                0 0 0 4px rgba(225, 190, 210, 0.2);

            transform: translateY(-1px);
        }

        .form-error {
            margin-top: 12px;

            color: #b76e79;
            font-size: 12px;

            background: #fff2f4;

            border-radius: 10px;

            animation: errorAppear 0.3s ease-out;
        }

        .form-error ul {
            margin: 0;
            padding: 9px 14px 9px 30px;
        }

        .update-button {
            width: 100%;

            margin-top: 20px;
            padding: 13px 18px;

            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.06em;

            background:
                linear-gradient(
                    135deg,
                    #d9b6c8,
                    #c9bce5
                );

            border: none;
            border-radius: 14px;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(185, 150, 180, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .update-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(185, 150, 180, 0.28);
        }

        .update-button:active {
            transform: scale(0.98);
        }

        .back-link {
            display: block;

            margin-top: 18px;

            text-align: center;
            text-decoration: none;

            color: #9a8fa0;
            font-size: 12px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-link:hover {
            color: #8173a6;
            transform: translateY(-1px);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rabbitFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes errorAppear {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            .update-container {
                padding: 16px;
            }

            .update-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <main class="update-container">

        <section class="update-card">

            <div class="title-area">
                <div class="rabbit">🐇</div>

                <h1>学習記録を編集</h1>

                <p class="subtitle">
                    学びの記録を、ちょっと整えよう。
                </p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <label>学習内容</label>

                {{ form.content }}

                {% if form.content.errors %}
                    <div class="form-error">
                        {{ form.content.errors }}
                    </div>
                {% endif %}

                <label>タグ</label>

                {{ form.tags }}

                {% if form.tags.errors %}
                <div class="form-error">
                {{ form.tags.errors }}
                </div>
                
                {% endif %}
                <button
                    class="update-button"
                    type="submit"
                >
                    更新する
                </button>
            </form>

            <a
                class="back-link"
                href="{% url 'dashboard' %}"
            >
                ← 学習ページに戻る
            </a>

        </section>

    </main>

</body>
</html>
