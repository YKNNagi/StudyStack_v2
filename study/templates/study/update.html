{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>学習記録を編集 | StudyStack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;

            color: #625d68;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 215, 225, 0.65),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(220, 210, 255, 0.6),
                    transparent 35%
                ),
                #fffafb;
        }

        .update-container {
            width: 100%;
            max-width: 540px;
            padding: 24px;

            animation: fadeUp 0.7s ease-out;
        }

        .update-card {
            padding: 40px 36px;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid rgba(235, 215, 225, 0.85);
            border-radius: 26px;

            box-shadow:
                0 12px 35px rgba(130, 105, 125, 0.12);

            backdrop-filter: blur(8px);
        }

        /* =========================
           タイトル
        ========================= */

        .title-area {
            margin-bottom: 30px;
            text-align: center;
        }

        .rabbit {
            display: inline-block;
            margin-bottom: 5px;

            font-size: 34px;

            animation: rabbitFloat 2.8s ease-in-out infinite;
        }

        h1 {
            margin: 4px 0 8px;

            color: #786b7d;
            font-size: 25px;
            letter-spacing: 0.06em;
        }

        .subtitle {
            margin: 0;

            color: #aaa0ad;
            font-size: 13px;
        }

        /* =========================
           フォーム共通
        ========================= */

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;

            margin-bottom: 8px;

            color: #807583;
            font-size: 13px;
            font-weight: 600;
        }

        /* =========================
           学習内容
        ========================= */

        .content-wrapper input {
            width: 100%;

            padding: 12px 14px;

            color: #625d68;
            font-size: 15px;

            background: #fff;

            border: 1px solid #e5dce4;
            border-radius: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .content-wrapper input:focus {
            border-color: #d7b7c9;

            box-shadow:
                0 0 0 4px rgba(225, 190, 210, 0.2);

            transform: translateY(-1px);
        }

        /* =========================
           タグ
        ========================= */

        .tag-wrapper select {
            width: 100%;
            min-height: 120px;

            padding: 10px 12px;

            color: #665e69;
            font-size: 13px;

            background:
                linear-gradient(
                    180deg,
                    #fffefe,
                    #fff8fb
                );

            border: 1px solid #e4d7e3;
            border-radius: 13px;

            outline: none;

            box-shadow:
                inset 0 1px 3px rgba(145, 115, 140, 0.05);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .tag-wrapper select:focus {
            border-color: #ccb5dd;

            box-shadow:
                0 0 0 4px rgba(203, 185, 229, 0.18);
        }

        .tag-help {
            margin: 7px 2px 0;

            color: #b0a4b2;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =========================
        選択中タグ
        ========================= */

        #selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            min-height: 29px;
            margin-top: 8px;
        }

        #selected-tags .tag-chip {
            padding: 6px 10px;

            color: #8f7189;
            font-size: 12px;
            font-weight: 600;

            background: #fff7fb;

            border: 1px solid #ead6e8;
            border-radius: 999px;
        }

        /* =========================
           エラー
        ========================= */

        .form-error {
            margin-top: 10px;

            color: #b76e79;
            font-size: 12px;

            background: #fff2f4;

            border-radius: 10px;

            animation: errorAppear 0.3s ease-out;
        }

        .form-error ul {
            margin: 0;
            padding: 9px 14px 9px 30px;
        }

        /* =========================
           更新ボタン
        ========================= */

        .update-button {
            width: 100%;

            margin-top: 4px;
            padding: 13px 18px;

            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.06em;

            background:
                linear-gradient(
                    135deg,
                    #d9b6c8,
                    #c9bce5
                );

            border: none;
            border-radius: 14px;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(185, 150, 180, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .update-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(185, 150, 180, 0.28);
        }

        .update-button:active {
            transform: scale(0.98);
        }

        /* =========================
           戻る
        ========================= */

        .back-link {
            display: block;

            margin-top: 20px;

            text-align: center;
            text-decoration: none;

            color: #9a8fa0;
            font-size: 12px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        .back-link:hover {
            color: #8173a6;
            transform: translateY(-1px);
        }

        /* =========================
           アニメーション
        ========================= */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rabbitFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes errorAppear {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           スマホ
        ========================= */

        @media (max-width: 520px) {
            .update-container {
                padding: 16px;
            }

            .update-card {
                padding: 32px 24px;
            }

            .tag-wrapper select {
                min-height: 105px;
            }
        }
    </style>
</head>

<body>

    <main class="update-container">

        <section class="update-card">

            <div class="title-area">

                <div class="rabbit">
                    🐇
                </div>

                <h1>
                    学習記録を編集
                </h1>

                <p class="subtitle">
                    学びの記録を、ちょっと整えよう。
                </p>

            </div>


            <form method="POST">
                {% csrf_token %}

                <!-- 学習内容 -->
                <div class="form-group content-wrapper">

                    <label
                        class="form-label"
                        for="{{ form.content.id_for_label }}"
                    >
                        学習内容
                    </label>

                    {{ form.content }}

                    {% if form.content.errors %}
                        <div class="form-error">
                            {{ form.content.errors }}
                        </div>
                    {% endif %}

                </div>


                <!-- タグ -->
                <div class="form-group tag-wrapper">

                    <label
                        class="form-label"
                        for="{{ form.tags.id_for_label }}"
                    >
                        タグ
                    </label>

                    {{ form.tags }}

                    <div id="selected-tags"></div>

                    <p class="tag-help">
                        Ctrlキーを押しながら最大2つまで選べます。
                    </p>

                    {% if form.tags.errors %}
                        <div class="form-error">
                            {{ form.tags.errors }}
                        </div>
                    {% endif %}

                </div>


                <button
                    class="update-button"
                    type="submit"
                >
                    更新する
                </button>

            </form>


            <a
                class="back-link"
                href="{% url 'dashboard' %}"
            >
                ← 学習ページに戻る
            </a>

        </section>

    </main>
    <script src="{% static 'study/dashboard.js' %}"></script>
</body>
</html>
